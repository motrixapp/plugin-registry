name: registry-entry-update
# Regenerates a builtin plugin's registry entry from a signed builtin-plugins
# release and opens a PR. Triggered by a repository_dispatch from
# builtin-plugins' release workflow, or manually via workflow_dispatch.
#
# SECURITY: repository_dispatch client_payload is fully attacker-settable by
# anyone holding the dispatch token, so id/tag are treated as untrusted:
# passed through `env:` (never interpolated straight into a shell) and
# strictly validated before use. The generator additionally verifies the
# Ed25519 signature of the downloaded artifact against the pinned key and
# binds the in-bundle manifest id/version to the tag, so a payload naming a
# tag that is not a genuine Motrix-signed release cannot produce a package.
on:
  workflow_dispatch:
    inputs:
      id:
        description: 'plugin id (e.g. motrix.url-resolver)'
        required: true
      tag:
        description: 'release tag (e.g. motrix.url-resolver@1.0.0)'
        required: true
  repository_dispatch:
    types: [builtin-released]
permissions:
  contents: write
  pull-requests: write
jobs:
  update-entry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Resolve & validate inputs
        id: in
        env:
          # Untrusted for repository_dispatch; quoted into env, never into shell.
          RAW_ID: ${{ github.event.inputs.id || github.event.client_payload.id }}
          RAW_TAG: ${{ github.event.inputs.tag || github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          # Charset guard FIRST: reject any char outside the safe set — this
          # also rejects newlines, so a multi-line payload cannot smuggle a
          # second "key=" line into $GITHUB_OUTPUT (whose parser is
          # last-write-wins). Only after this are the anchored shape checks
          # meaningful (grep is line-oriented; the guard guarantees one line).
          case "$RAW_ID" in ''|*[!a-z0-9.-]*) echo "rejecting id: '$RAW_ID'"; exit 1 ;; esac
          case "$RAW_TAG" in ''|*[!A-Za-z0-9.@+-]*) echo "rejecting tag: '$RAW_TAG'"; exit 1 ;; esac
          printf '%s' "$RAW_ID" | grep -qxE 'motrix\.[a-z0-9][a-z0-9-]*' \
            || { echo "bad id shape: '$RAW_ID'"; exit 1; }
          printf '%s' "$RAW_TAG" | grep -qxE 'motrix\.[a-z0-9][a-z0-9-]*@[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?' \
            || { echo "bad tag shape: '$RAW_TAG'"; exit 1; }
          case "$RAW_TAG" in
            "$RAW_ID"@*) : ;;
            *) echo "tag '$RAW_TAG' does not belong to id '$RAW_ID'"; exit 1 ;;
          esac
          {
            echo "id=$RAW_ID"
            echo "tag=$RAW_TAG"
            echo "version=${RAW_TAG#*@}"
          } >> "$GITHUB_OUTPUT"
      - name: Generate entry from the signed release
        env:
          PLUGIN_ID: ${{ steps.in.outputs.id }}
          PLUGIN_TAG: ${{ steps.in.outputs.tag }}
        run: pnpm entry:from-release "$PLUGIN_ID" "$PLUGIN_TAG"
      - name: Self-gate
        run: pnpm validate && pnpm test
      # Prefer a GitHub App token for the PR so it TRIGGERS this repo's
      # on:pull_request CI (a GITHUB_TOKEN-created PR does not, by GitHub's
      # anti-recursion rule). Requires the App to also have Pull requests:
      # write and its creds stored here; when absent we fall back to
      # GITHUB_TOKEN (PR still opens, just without PR-triggered CI — the
      # Self-gate above already validated the entry either way).
      - name: Check PR-token App credentials
        id: pr_app
        env:
          APP_ID: ${{ secrets.REGISTRY_DISPATCH_APP_ID || vars.REGISTRY_DISPATCH_APP_ID }}
          APP_KEY: ${{ secrets.REGISTRY_DISPATCH_APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_KEY" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "App creds not set — PR will use GITHUB_TOKEN (no PR-triggered CI)"
          fi
      - name: Mint PR token
        id: pr_token
        if: steps.pr_app.outputs.present == 'true'
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.REGISTRY_DISPATCH_APP_ID || vars.REGISTRY_DISPATCH_APP_ID }}
          private-key: ${{ secrets.REGISTRY_DISPATCH_APP_PRIVATE_KEY }}
      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ steps.pr_token.outputs.token || github.token }}
          branch: "auto/entry-${{ steps.in.outputs.id }}-${{ steps.in.outputs.version }}"
          title: "chore: update ${{ steps.in.outputs.id }} to ${{ steps.in.outputs.tag }}"
          body: |
            Automated registry entry update from a signed builtin-plugins release.

            The generator verified the ed25519 signature against
            `keys/signing-key.pub.pem` and bound the in-bundle manifest
            id/version to the tag. Merging still requires the standard
            validate/test/lockstep CI to pass.

            - id: `${{ steps.in.outputs.id }}`
            - tag: `${{ steps.in.outputs.tag }}`
          commit-message: "chore: update ${{ steps.in.outputs.id }} package to ${{ steps.in.outputs.tag }}"
          add-paths: plugins/
