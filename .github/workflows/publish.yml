name: Publish

# Aggregates plugins/ into dist/plugins.json and uploads it (plus assets/)
# to the motrix-registry R2 bucket served by dl.motrix.app/registry/*.
# Uploads use the S3-compatible API so the credentials can stay scoped to
# this one bucket (Object Read & Write) — wrangler's REST path would need
# an account-wide Admin token (cloudflare/workers-sdk#9235).
# Requires repo secrets: R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY,
# CLOUDFLARE_ACCOUNT_ID.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: plugin-publishing
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm aggregate

      - name: Upload plugins.json to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          # R2 predates the aws CLI v2.23 default integrity checksums
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: >
          aws s3api put-object
          --endpoint-url "$R2_ENDPOINT"
          --bucket motrix-registry
          --key plugins.json
          --body dist/plugins.json
          --content-type "application/json; charset=utf-8"

      - name: Upload assets to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
        run: |
          if [ -d assets ]; then
            aws s3 sync assets/ "s3://motrix-registry/assets/" --endpoint-url "$R2_ENDPOINT"
          else
            echo "no assets directory; skipping"
          fi
